<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Épargne">
<meta name="theme-color" content="#000000">
<title>Épargne</title>
<style>
:root{--bg:#000;--fg:#fff;--mute:#6f6f76;--card:#17181a;--red:#ff3b57;--green:#2fd16b;--pill:#ececec;--line:#26272a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:var(--h,100%);background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;width:100%;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{all:unset;cursor:pointer}
[hidden]{display:none!important}
.app{height:100%;max-width:405.6px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:15.6px 17.2px 0}
.tabs{display:flex;gap:12.6px;font-size:clamp(19.5px,5.9vw,25px);font-weight:700;letter-spacing:-.5px}
.tabs button{color:var(--mute)}.tabs button.on{color:var(--fg)}
.avatar{position:relative;width:35.9px;height:35.9px;border-radius:50%;background:#3a3a3d;display:grid;place-items:center;font-weight:700;font-size:15.6px;color:#dcdcdc}
.avatar i{position:absolute;top:-2px;right:-2px;width:11.7px;height:11.7px;border-radius:50%;background:#2f6bff;border:2px solid #000}
.acc{display:flex;justify-content:space-between;align-items:center;padding:23.4px 18.7px 0;color:var(--mute);font-size:14.8px;font-weight:600}
.acc svg{width:18.7px;height:12.6px}
.val{padding:3.6px 18.7px 0;display:flex;align-items:baseline;gap:12.6px;min-height:48.4px}
.amount{font-size:clamp(26px,7.2vw,34px);font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct{font-size:14.8px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--green)}
.ranges{display:flex;gap:clamp(14px,5.5vw,25px);padding:23.4px 18.7px 0;font-size:15.6px;font-weight:700;color:var(--mute)}
.ranges button{padding:5.4px 0}.ranges button.on{color:var(--fg)}
.view{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chart{flex:1;min-height:56px;position:relative;margin-top:5.4px;touch-action:none;user-select:none;-webkit-user-select:none}
.chart.fix{flex:0 1 132.6px;min-height:70px}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.cur{position:absolute;top:0;bottom:0;width:1px;background:#8a8a90;display:none}
.cur b{position:absolute;left:-4.5px;width:9.9px;height:9.9px;border-radius:50%;margin-top:-4.5px}
.promo{margin:0 17.2px;position:relative;background:var(--card);border-radius:23.4px;padding:21.8px 18.7px 15.6px;box-shadow:0 -5.4px 0 -2px #3b3f45;min-height:117px;flex:none}
.x{position:absolute;top:10.8px;right:14.4px;color:#55555a;font-size:17.2px;padding:5.4px}
.promo h3{margin:0;font-size:16.4px;font-weight:700}
.promo p{margin:7.2px 0 0;color:#8c8c92;font-size:15.3px;font-weight:600;max-width:58%;min-height:34.3px}
.ring{position:absolute;right:18.7px;top:50%;transform:translateY(-50%);width:71.8px;height:71.8px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.dots{display:flex;gap:5.4px;margin-top:12.6px}
.dots i{width:6.3px;height:6.3px;border-radius:3.6px;background:#4a4a4f;transition:width .25s,background .25s}
.dots i.on{width:13.5px;background:#bdbdc2}
.chips{display:flex;gap:12.6px;padding:18.7px 17.2px 0;overflow:hidden;flex:none}
.chips button{flex:0 0 auto;min-width:101.4px;background:#101012;border-radius:17.2px;padding:15.6px 23.4px 34.3px;font-size:15.6px;font-weight:700;color:#55555c}
.spacer{height:79.6px;flex:none}
.fab{position:absolute;left:17.2px;right:17.2px;bottom:14.4px;display:flex;gap:14.4px}
.fab button{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--pill);color:#000;border-radius:20.3px;padding:0 15.6px;height:51.5px;font-size:16.4px;font-weight:700;box-shadow:0 5.4px 18.7px rgba(0,0,0,.5);transition:transform .12s}
.fab button:active{transform:scale(.97)}
.fab svg{width:21.8px;height:21.8px}
.cash{padding:5.4px 18.7px 0;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.gh{color:var(--mute);font-size:13.5px;font-weight:600;padding:15.6px 0 3.6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13.5px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.row small{display:block;color:var(--mute);font-size:12.6px;margin-top:2.7px;font-weight:500}
.empty{color:var(--mute);font-size:15.3px;line-height:1.4;padding-top:14.4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:405.6px;margin:0 auto;background:#141416;border-radius:23.4px 23.4px 0 0;padding:12.6px 17.2px calc(18.7px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:6;max-height:88dvh;overflow:auto}
.sheet.on{transform:none}
.grab{width:32.8px;height:4.5px;border-radius:2.7px;background:#3a3a3e;margin:0 auto 14px}
.sheet h2{margin:0 0 14.4px;font-size:18.7px;letter-spacing:-.3px}
label{display:block;color:var(--mute);font-size:12.6px;font-weight:600;margin:12.6px 0 5.4px}
input{width:100%;background:#1f2022;border:1px solid #2c2d30;color:#fff;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:600;font-family:inherit;outline:none}
input:focus{border-color:#5b5fe8}
.seg{display:flex;gap:7.2px}
.seg button{flex:1;text-align:center;padding:11.7px 5.4px;border-radius:12.6px;background:#1f2022;font-size:12.6px;font-weight:700;color:#9a9aa1}
.seg button.on{background:var(--pill);color:#000}
.cta{display:block;text-align:center;background:var(--pill);color:#000;border-radius:15.6px;padding:14px;font-size:14.8px;font-weight:700;margin-top:17.2px}
.ghost{display:block;text-align:center;color:var(--mute);font-weight:600;font-size:14.4px;margin-top:14.4px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:9px;min-height:14px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12.6px);transform:translate(-50%,-70.2px);background:#2a2b2e;padding:10.8px 14px;border-radius:14.4px;font-weight:600;font-size:13.5px;z-index:9;transition:transform .3s;max-width:90%}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app,.sheet{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{transition:opacity .12s,transform .12s}
button:active{opacity:.55}
.fab button{height:54px}
.fab button:active{opacity:1;transform:scale(.96)}
.ranges button{padding:12px 6px;margin:-6px -6px}
.tabs button{padding:10px 0}
.avatar{min-width:44px;min-height:44px}
.seg button{font-size:13px;padding:14px 4px}
.row{min-height:48px}
.row:active{background:#0e0e10}
.cash,.sheet{overscroll-behavior:contain}
.chips{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
@media (max-height:760px){.chips{display:none}.promo{min-height:100px;padding:16px 16px 12px}}
@media (max-height:640px){.promo{display:none}.ranges{padding-top:14px}.acc{padding-top:16px}}
@media (max-height:500px){.fab{display:none}.spacer{height:12px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="tabs"><button id="t-sav" class="on">Épargne</button><button id="t-cash">Espèces</button></div>
    <button class="avatar" id="avatar" aria-label="Réglages"><span id="ini">K</span><i></i></button>
  </header>

  <div class="acc"><span id="accname">Compte-Titres</span>
    <svg viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l9 8 9-8"/></svg>
  </div>
  <div class="val"><div class="amount" id="amount"></div><div class="pct" id="pct"></div></div>

  <div class="view" id="v-sav">
    <div class="ranges" id="ranges">
      <button data-r="1J">1J</button><button data-r="1S" class="on">1S</button><button data-r="1M">1M</button><button data-r="1Y">1Y</button><button data-r="Max">Max</button>
    </div>
    <div class="chart" id="ch1"><svg id="ch1s" preserveAspectRatio="none"></svg><div class="cur" id="ch1c"><b id="ch1d"></b></div></div>
    <div class="promo" id="promo">
      <button class="x" id="close" aria-label="Fermer">✕</button>
      <h3 id="p-t"></h3><p id="p-s"></p>
      <div class="dots" id="dots"></div>
      <div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="46" fill="none" stroke="#2c2d30" stroke-width="5"/><circle cx="52" cy="52" r="46" fill="none" stroke="#d9dbe0" stroke-width="5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="70" transform="rotate(-90 52 52)"/></svg><b>10j</b></div>
    </div>
    <div class="chips"><button data-n="Aucun favori pour l’instant">Favoris</button><button data-n="Aucun plan d’épargne actif">Plans d’épar…</button><button data-n="Aucun ordre en cours">Ordres</button></div>
    <div class="spacer"></div>
  </div>

  <div class="view" id="v-cash" hidden>
    <div class="ranges" id="ranges2">
      <button data-r="1J">1J</button><button data-r="1S">1S</button><button data-r="1M">1M</button><button data-r="1Y">1Y</button><button data-r="Max" class="on">Max</button>
    </div>
    <div class="chart fix" id="ch2"><svg id="ch2s" preserveAspectRatio="none"></svg><div class="cur" id="ch2c"><b id="ch2d"></b></div></div>
    <div class="cash"><div id="txs"></div><div class="spacer"></div></div>
  </div>

  <div class="fab">
    <button id="b-search">Rechercher <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button id="b-trans">Transférer <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button>
  </div>
</div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
function fit(){document.documentElement.style.setProperty('--h',Math.round(window.innerHeight)+'px')}
fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,250)});window.addEventListener('pageshow',fit);
var $=function(s){return document.querySelector(s)};
var KEY='epargne.v8',W=520,H=300,RED='#ff3b57',GRN='#2fd16b';
function D(m,d,h){return new Date(2026,m,d,h,0,0).getTime()}
function defTx(){
  var L=[[8,28,[10.10,10.10]],[8,30,[25.25]],[9,7,[10.10,15.15]],[9,8,[10.10]],[9,9,[10.10]],[9,12,[10.10,10.10,10.10]],[9,14,[12.12,18.18]],[9,15,[10.10,31.31]],[9,16,[35.35,16.16,18.18]],[9,19,[10.10,10.10,10.10,15.15]],[9,21,[12.12]],[9,22,[11.11]],[9,23,[10.10]],[9,24,[11.11,11.11]]],o=[];
  L.forEach(function(g){g[2].forEach(function(a,i){o.push({l:'Versement',s:'Carte bancaire',a:a,t:D(g[0],g[1],9+i*2),p:g[0]===9&&g[1]===24})})});
  var X=[[9,1,17,'Lidl Castres',9.84],[9,2,12,'Le Fournil de Castres',3.60],[9,3,18,'Carrefour Castres',6.85],[9,5,17,'Lidl Castres',6.45],[9,7,17,'Lidl Castres',7.12],[9,8,15,'Action',9.89],[9,9,17,'Lidl Castres',5.38],[9,10,18,'Carrefour Castres',19.64],[9,11,12,'Le Fournil de Castres',5.10],[9,12,17,'Lidl Castres',8.90],[9,13,20,'Pizzeria',14.50],[9,14,18,'Carrefour Castres',4.35],[9,14,12,'Lidl Castres',4.67],[9,16,17,'Lidl Castres',6.26],[9,17,16,'Aldi',17.18],[9,18,21,'Tacos',9.90],[9,19,12,'Le Fournil de Castres',4.20],[9,19,17,'Lidl Castres',7.53],[9,21,16,'Aldi',12.40],[9,21,17,'Lidl Castres',8.15],[9,22,18,'Carrefour Castres',21.97],[9,23,15,'Action',5.75],[9,23,17,'Lidl Castres',6.43]];
  X.forEach(function(g){
    o.push({l:g[3],s:'Paiement par carte',a:-g[4],t:D(g[0],g[1],g[2])});
  });
  /* 105,54 € investis : 104,15 € aujourd’hui = −1,32 % */
  o.push({l:'Vers l’épargne',s:'Virement interne',a:-105.54,t:D(9,16,18)});
  return o;
}
function defs(){return {initial:'K',savings:104.15,pcts:{'1J':-0.18,'1S':-1.32,'1M':-1.32,'1Y':3.52,'Max':3.52},tab:'sav',range:'1S',range2:'Max',tx:defTx(),promo:true}}
var S=defs();
try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in o)S[k]=o[k]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function eur(n){return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/[\u202f\u00a0]/g,'\u00a0')+'\u00a0€'}
function num(v){return parseFloat(String(v).replace(/[\s\u00a0]/g,'').replace(',','.').replace('−','-').replace('—','-'))}
function r2(n){return Math.round(n*100)/100}
function cash(){return r2(S.tx.reduce(function(s,x){return s+x.a},0))}

/* ---- fabrique de graphique (tracé + curseur tactile) ---- */
function mk(id,at,end){
  var ch=$('#'+id),svg=$('#'+id+'s'),cur=$('#'+id+'c'),dot=$('#'+id+'d'),sc={mn:0,rg:1,flat:false};
  function Y(v){return .12+.76*(1-(sc.flat?.5:(v-sc.mn)/sc.rg))}
  function draw(path,col){
    var vs=path.map(function(p){return p[1]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
    sc={mn:mn,rg:(mx-mn)||1,flat:mx-mn<1e-9};
    var d='M'+path.map(function(p){return (p[0]*W).toFixed(1)+','+(Y(p[1])*H).toFixed(1)}).join(' L');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML='<defs><linearGradient id="g'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".3"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs><path d="'+d+' L'+W+','+H+' L0,'+H+' Z" fill="url(#g'+id+')"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  }
  function mv(e){
    var b=ch.getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),r=at(f);
    cur.style.display='block';cur.style.left=(f*100)+'%';dot.style.top=(Y(r.v)*100)+'%';dot.style.background=r.c;
  }
  function up(){cur.style.display='none';end()}
  ch.addEventListener('pointerdown',function(e){ch.setPointerCapture(e.pointerId);if(navigator.vibrate)navigator.vibrate(8);mv(e)});
  ch.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')mv(e)});
  ch.addEventListener('pointerup',up);ch.addEventListener('pointercancel',up);
  return {draw:draw};
}

/* ---- Épargne : courbe du compte-titres ---- */
var N=120,P=[],EXP={'1J':1,'1S':3,'1M':3,'1Y':1,'Max':1};
function pc(){return S.pcts[S.range]}
function series(){
  var x=({'1J':3,'1S':7,'1M':11,'1Y':19,'Max':23}[S.range])*977;
  function r(){x=(x*9301+49297)%233280;return x/233280}
  var vol={'1J':.003,'1S':.008,'1M':.02,'1Y':.06,'Max':.12}[S.range],w=[0],i;
  for(i=1;i<N;i++)w.push(w[i-1]+r()-.5);
  var end=w[N-1];P=[];
  for(i=0;i<N;i++){var t=i/(N-1);P.push(1+pc()/100*Math.pow(t,EXP[S.range])+(w[i]-end*t)*vol/3.2)}
  P[0]=1;P[N-1]=1+pc()/100;
}
function headS(p,val){
  $('#amount').textContent=eur(val);
  var e=$('#pct');e.textContent=(p<0?'— ':'+ ')+Math.abs(p).toFixed(2).replace('.',',')+' %';e.className='pct '+(p<0?'neg':'pos');
}
var c1=mk('ch1',function(f){
  var i=Math.round(f*(N-1));headS((P[i]-1)*100,S.savings*P[i]/P[N-1]);
  return {v:P[i],c:pc()<0?RED:GRN};
},function(){headS(pc(),S.savings)});
function drawS(){
  series();headS(pc(),S.savings);
  c1.draw(P.map(function(p,i){return [i/(N-1),p]}),pc()<0?RED:GRN);
}

/* ---- Espèces : solde cumulé des mouvements ---- */
var CS=null,SPAN={'1J':864e5,'1S':6048e5,'1M':2592e6,'1Y':31536e6};
function cashSeries(){
  var now=Date.now(),tx=S.tx.slice().sort(function(a,b){return a.t-b.t}),
      t0=S.range2==='Max'?(tx.length?tx[0].t-864e5:now-SPAN['1S']):now-SPAN[S.range2],
      t1=Math.max(now,tx.length?tx[tx.length-1].t:now),bal=0,i=0;
  while(i<tx.length&&tx[i].t<t0){bal+=tx[i].a;i++}
  var start=bal,path=[[0,bal]];
  for(;i<tx.length;i++){var f=(tx[i].t-t0)/(t1-t0);path.push([f,bal]);bal+=tx[i].a;path.push([f,bal])}
  path.push([1,bal]);
  return {path:path,t0:t0,t1:t1,start:start,end:bal,tx:tx};
}
function headC(bal,delta){
  $('#amount').textContent=eur(r2(bal));
  var e=$('#pct'),d=r2(delta);
  if(Math.abs(d)<.005){e.textContent='';e.className='pct'}
  else{e.textContent=(d<0?'− ':'+ ')+eur(Math.abs(d));e.className='pct '+(d<0?'neg':'pos')}
}
var c2=mk('ch2',function(f){
  var t=CS.t0+f*(CS.t1-CS.t0),b=0;
  CS.tx.forEach(function(x){if(x.t<=t)b+=x.a});
  headC(b,b-CS.start);return {v:b,c:GRN};
},function(){headC(CS.end,CS.end-CS.start)});
function dayLabel(t){var s=new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function listHtml(){
  var tx=S.tx.slice().sort(function(a,b){return b.t-a.t}),h='',last='';
  tx.forEach(function(x){
    var k=new Date(x.t).toDateString();
    if(k!==last){last=k;h+='<div class="gh">'+dayLabel(x.t)+'</div>'}
    h+='<div class="row"><div>'+x.l+'<small>'+(x.p?'En attente':x.s)+'</small></div><div class="'+(x.a<0?'neg':'pos')+'">'+(x.a<0?'−':'+')+'\u00a0'+eur(Math.abs(x.a))+'</div></div>';
  });
  return h||'<div class="empty">Aucun mouvement. Utilisez Transférer pour ajouter de l’argent.</div>';
}
function drawC(){
  CS=cashSeries();headC(CS.end,CS.end-CS.start);
  c2.draw(CS.path,CS.end-CS.start<0?RED:GRN);
  $('#txs').innerHTML=listHtml();
}

function render(){
  var sav=S.tab==='sav';
  $('#t-sav').classList.toggle('on',sav);$('#t-cash').classList.toggle('on',!sav);
  $('#v-sav').hidden=!sav;$('#v-cash').hidden=sav;
  $('#ini').textContent=(S.initial||'K').slice(0,1).toUpperCase();
  $('#accname').textContent=sav?'Compte-Titres':'Compte espèces';
  if(sav){$('#promo').style.display=S.promo?'':'none';drawS()}else drawC();
  save();
}

/* ---- navigation ---- */
$('#t-sav').onclick=function(){S.tab='sav';render()};
$('#t-cash').onclick=function(){S.tab='cash';render()};
function ranges(id,key,redraw){
  $(id).onclick=function(e){var b=e.target.closest('button');if(!b)return;S[key]=b.dataset.r;
    [].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)});redraw();save()};
  [].forEach.call($(id).children,function(c){c.classList.toggle('on',c.dataset.r===S[key])});
}
ranges('#ranges','range',drawS);ranges('#ranges2','range2',drawC);
document.querySelector('.chips').onclick=function(e){var b=e.target.closest('button');if(b)toast(b.dataset.n)};
$('#close').onclick=function(){S.promo=false;render()};

/* ---- carte promo ---- */
var slides=[['Invitez des amis. ›','Recevez 50 € en actions.'],['Plan d’épargne ›','Investissez chaque mois.'],['Intérêts sur espèces ›','2,00 % par an.'],['Sécurisez votre compte ›','Activez la double vérification.'],['Découvrez les ETF ›','Diversifiez en un seul ordre.']],si=0;
function slide(n){si=n;$('#p-t').textContent=slides[n][0];$('#p-s').textContent=slides[n][1];$('#dots').innerHTML=slides.map(function(_,i){return '<i'+(i===n?' class="on"':'')+'></i>'}).join('')}
var swiped=false,px=null;
$('#promo').addEventListener('click',function(e){if(swiped){swiped=false;return}if(e.target.closest('#close'))return;slide((si+1)%slides.length)});
$('#promo').addEventListener('touchstart',function(e){px=e.touches[0].clientX},{passive:true});
$('#promo').addEventListener('touchend',function(e){if(px===null)return;var dx=e.changedTouches[0].clientX-px;px=null;if(Math.abs(dx)>40){swiped=true;slide((si+(dx<0?1:slides.length-1))%slides.length);setTimeout(function(){swiped=false},350)}});
setInterval(function(){if(S.promo&&S.tab==='sav')slide((si+1)%slides.length)},5000);slide(0);

/* ---- feuilles ---- */
var ov=$('#ov'),sh=$('#sheet'),tt;
function open(html){sh.innerHTML='<div class="grab"></div>'+html;ov.classList.add('on');sh.classList.add('on')}
function closeSheet(){ov.classList.remove('on');sh.classList.remove('on');if(document.activeElement)document.activeElement.blur()}
ov.onclick=closeSheet;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2200)}

var assets=[['Monde ETF','MND','82,40 €','+0,42 %'],['Europe 600 ETF','EU6','61,12 €','−0,21 %'],['Tech 100','T100','215,30 €','+1,10 %'],['Énergie verte','ENV','18,75 €','−1,84 %'],['Obligations euro','OBE','47,90 €','+0,09 %'],['Or physique','OR','74,05 €','+0,63 %']];
$('#b-search').onclick=function(){
  open('<h2>Rechercher</h2><input id="q" placeholder="Nom ou symbole" autocomplete="off"><div id="res"></div>');
  function list(q){q=q.toLowerCase();$('#res').innerHTML=assets.filter(function(a){return !q||(a[0]+a[1]).toLowerCase().indexOf(q)>-1}).map(function(a){return '<div class="row" data-a="'+a[0]+'"><div>'+a[0]+'<small>'+a[1]+'</small></div><div style="text-align:right">'+a[2]+'<small class="'+(a[3][0]==='+'?'pos':'neg')+'">'+a[3]+'</small></div></div>'}).join('')||'<div class="empty">Aucun résultat.</div>'}
  list('');$('#q').oninput=function(){list(this.value)};
  $('#res').onclick=function(e){if(e.target.closest('.row')){closeSheet();toast('Achat indisponible dans cette démo')}};
};

var dir='add';
$('#b-trans').onclick=function(){
  dir='add';
  open('<h2>Transférer</h2><div class="seg" id="seg"><button data-d="add" class="on">Ajouter</button><button data-d="toCash">Épargne → Espèces</button><button data-d="toSav">Espèces → Épargne</button></div><label>Montant (€)</label><input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off"><div class="err" id="err"></div><button class="cta" id="ok">Confirmer</button><button class="ghost" id="no">Annuler</button>');
  $('#seg').onclick=function(e){var b=e.target.closest('button');if(!b)return;dir=b.dataset.d;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)})};
  $('#no').onclick=closeSheet;
  $('#ok').onclick=function(){
    var a=num($('#amt').value),er=$('#err');
    if(!(a>0)){er.textContent='Saisissez un montant supérieur à 0.';return}
    a=r2(a);
    if(dir==='toCash'&&a>S.savings+1e-9){er.textContent='Solde épargne insuffisant.';return}
    if(dir==='toSav'&&a>cash()+1e-9){er.textContent='Solde espèces insuffisant.';return}
    var t=Date.now();
    if(dir==='add')S.tx.push({l:'Versement',s:'Carte bancaire',a:a,t:t});
    else if(dir==='toCash'){S.savings=r2(S.savings-a);S.tx.push({l:'Depuis l’épargne',s:'Virement interne',a:a,t:t})}
    else{S.savings=r2(S.savings+a);S.tx.push({l:'Vers l’épargne',s:'Virement interne',a:-a,t:t})}
    render();closeSheet();toast('Transfert effectué');
  };
};

$('#avatar').onclick=function(){
  open('<h2>Réglages</h2><label>Initiale du profil</label><input id="s-i" maxlength="1" value="'+S.initial+'"><label>Solde du compte-titres (€)</label><input id="s-s" inputmode="decimal" value="'+String(S.savings).replace('.',',')+'"><label>Variation sur la période '+S.range+' (%, négatif = baisse)</label><input id="s-p" inputmode="text" value="'+String(pc()).replace('.',',')+'"><div class="err" id="err"></div><button class="cta" id="ok">Enregistrer</button><button class="ghost" id="rs">Tout réinitialiser</button>');
  $('#ok').onclick=function(){
    var s=num($('#s-s').value),p=num($('#s-p').value);
    if(isNaN(s)||isNaN(p)||s<0){$('#err').textContent='Vérifiez les valeurs saisies.';return}
    S.initial=$('#s-i').value||'K';S.savings=s;S.pcts[S.range]=Math.max(-99,Math.min(999,p));
    render();closeSheet();
  };
  $('#rs').onclick=function(){S=defs();render();closeSheet();ranges('#ranges','range',drawS);ranges('#ranges2','range2',drawC)};
};


/* ---- gestes : fermer une feuille en la tirant, changer d’onglet en glissant ---- */
var sy=0,dy=0,drag=false;
sh.addEventListener('touchstart',function(e){if(sh.scrollTop>0||e.target.closest('input'))return;sy=e.touches[0].clientY;dy=0;drag=true;sh.style.transition='none'},{passive:true});
sh.addEventListener('touchmove',function(e){if(!drag)return;dy=Math.max(0,e.touches[0].clientY-sy);sh.style.transform='translateY('+dy+'px)'},{passive:true});
sh.addEventListener('touchend',function(){if(!drag)return;drag=false;sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet()});
var ax=null,ay=0;
document.addEventListener('touchstart',function(e){ax=null;if(e.target.closest('.chart,.promo,.sheet,.ov,input,.chips'))return;ax=e.touches[0].clientX;ay=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(ax===null)return;var dx=e.changedTouches[0].clientX-ax,dv=e.changedTouches[0].clientY-ay;ax=null;if(Math.abs(dx)>70&&Math.abs(dv)<45){var t=dx<0?'cash':'sav';if(S.tab!==t){S.tab=t;render()}}});


/* ---- clavier : la feuille reste au-dessus ---- */
if(window.visualViewport){var vv=window.visualViewport;
  var kb=function(){var off=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);sh.style.bottom=off+'px';sh.style.maxHeight=Math.round(vv.height*.9)+'px'};
  vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);
}
sh.addEventListener('focusin',function(e){var t=e.target;setTimeout(function(){if(t.scrollIntoView)t.scrollIntoView({block:'center',behavior:'smooth'})},300)});

render();
})();
</script>
</body>
</html>
